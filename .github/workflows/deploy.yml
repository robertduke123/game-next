name: Build and Release Next.js

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can switch branches cleanly

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Disable Next Font Loader completely
        run: echo "module.exports = function() { return ''; };" > node_modules/next/dist/build/webpack/loaders/next-font-loader/index.js

      - - name: Build Application
        run: npm run build
        env:
          NEXT_PHASE: phase-production-build
          NEXT_PUBLIC_URL_API_KEY: ${{ secrets.NEXT_PUBLIC_URL_API_KEY }}
          NEXT_PUBLIC_X_RAPID_API: ${{ secrets.NEXT_PUBLIC_X_RAPID_API }}

      # BULLETPROOF FIX: Native git commands to force-track .next and push to release
      - name: Deploy Pre-built Assets
        run: |
          # 1. Configure a temporary git profile for the runner
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Force add the hidden .next folder despite any .gitignore files
          git add -f .next/

          # 3. Commit the changes locally
          git commit -m "build: include compiled production assets"

          # 4. Force push the compiled state directly into the release branch
          git push origin HEAD:release --force
