name: Build and Release Next.js

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Disable Next Font Loader completely
        run: echo "module.exports = function() { return ''; };" > node_modules/next/dist/build/webpack/loaders/next-font-loader/index.js

      - name: Build Application
        run: npm run build
        env:
          NEXT_PHASE: phase-production-build

      # UPDATED STEP: Forcefully bypass .gitignore exclusions to upload the build artifacts
      - name: Push Pre-Built Assets to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: .
          force_orphan: true # Creates a clean snapshot containing the compiled build assets
